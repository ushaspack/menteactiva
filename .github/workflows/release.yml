# Publica una versión nueva cada vez que se sube una etiqueta tipo v0.2.0.
# Construye el instalador de Windows (y de macOS y Linux) y lo adjunta a una «Release» de este repositorio.
# La app instalada mira esa Release para avisar de las actualizaciones.
name: Publicar versión

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app

  instaladores:
    needs: pruebas
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - name: Poner en la app la versión de la etiqueta
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare-bundle
        working-directory: desktop

      - name: Construir y publicar
        working-directory: desktop
        run: npx electron-builder --config electron-builder.config.cjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
